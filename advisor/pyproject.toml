[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "master-duel-advisor"
version = "0.1.0"
description = "校正型の観測専用 Master Duel アドバイザー"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88; sys_platform != 'win32'", "opencv-python==4.12.0.88; sys_platform == 'win32'", "pydantic==2.12.3", "psutil==7.1.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
chatgpt = ["PyJWT[crypto]==2.10.1", "cryptography==46.0.3"]
windows = ["dxcam==0.0.5; sys_platform == 'win32'", "mss==10.1.0; sys_platform == 'win32'", "comtypes==1.4.17; sys_platform == 'win32'"]

[project.scripts]
md-advisor = "master_duel_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
